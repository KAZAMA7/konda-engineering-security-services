AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static website on a private S3 bucket behind CloudFront (Origin Access Control), with HTTPS for a custom
  domain and no edge or server runtime. Deploy this stack in us-east-1 when it should issue the certificate.

Parameters:
  ContentSecurityPolicy:
    Type: String
    Description: Use the current build's .deploy/csp.txt on every stack creation or update.
    MinLength: 1
    MaxLength: 1783
    AllowedPattern: '^(?!.*(?i:unsafe-inline|unsafe-eval)).+$'
    ConstraintDescription: Supply a single-line CSP without unsafe-inline or unsafe-eval.
    Default: "default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; manifest-src 'none'; upgrade-insecure-requests"
  DomainName:
    Type: String
    Default: konda.com
    Description: >-
      Public hostname served by CloudFront, without a scheme or path. Leave empty to use only the
      *.cloudfront.net hostname.
    AllowedPattern: '^$|(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Use a lowercase DNS hostname such as konda.com, or an empty string.
  HostedZoneId:
    Type: String
    Default: ''
    Description: >-
      Public Route 53 hosted zone for DomainName. When set, the stack issues a DNS-validated ACM certificate
      (the stack must then run in us-east-1) and creates the apex A/AAAA alias records to CloudFront.
    AllowedPattern: '^$|^Z[0-9A-Z]{1,31}$'
    ConstraintDescription: Use the bare hosted zone ID (for example Z0123456789ABCDEFGHIJ), not /hostedzone/....
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >-
      Already issued ACM certificate in us-east-1 covering DomainName, for DNS hosted outside Route 53.
      Leave empty when HostedZoneId is set.
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: CloudFront only accepts certificates from ACM in us-east-1.

Rules:
  DomainNeedsExactlyOneCertificateSource:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref DomainName, '']
            - !Equals [!Ref HostedZoneId, '']
            - !Equals [!Ref AcmCertificateArn, '']
          - !And
            - !Not [!Equals [!Ref DomainName, '']]
            - !Or
              - !And
                - !Not [!Equals [!Ref HostedZoneId, '']]
                - !Equals [!Ref AcmCertificateArn, '']
              - !And
                - !Equals [!Ref HostedZoneId, '']
                - !Not [!Equals [!Ref AcmCertificateArn, '']]
        AssertDescription: >-
          With a DomainName supply exactly one of HostedZoneId (Route 53 managed certificate and records) or
          AcmCertificateArn (external DNS). Without a DomainName leave both empty.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  ManagesDns: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: konda-services

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: ManagesDns
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: konda-services

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub
          - 'static-site-oac-${Id}'
          - Id: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub
          - 'static-site-cache-${Id}'
          - Id: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SiteResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub
          - 'static-site-headers-${Id}'
          - Id: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
        Comment: Bootstrap defaults; the deployment workflow applies the generated header policy.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Ref ContentSecurityPolicy
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: konda-services
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} static site'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !If [ManagesDns, !Ref SiteCertificate, !Ref AcmCertificateArn]
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: private-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
          ResponseHeadersPolicyId: !Ref SiteResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: AllowOnlyThisCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # CloudFront's fixed Route 53 hosted zone ID for alias records is Z2FDTNDATAQYW2 in every region.
  ApexDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: ManagesDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Comment: !Sub '${AWS::StackName}: apex alias records to CloudFront'
      RecordSets:
        - Name: !Sub '${DomainName}.'
          Type: A
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Sub '${DomainName}.'
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt SiteDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Outputs:
  AWSRegion:
    Description: Region of the bucket; also the value for the AWS_REGION deployment variable.
    Value: !Ref 'AWS::Region'
  S3BucketName:
    Description: Value for the S3_BUCKET deployment variable.
    Value: !Ref SiteBucket
  S3BucketArn:
    Value: !GetAtt SiteBucket.Arn
  CloudFrontDistributionId:
    Description: Value for the CLOUDFRONT_DISTRIBUTION_ID deployment variable.
    Value: !Ref SiteDistribution
  CloudFrontDistributionArn:
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
  CloudFrontDomainName:
    Description: DNS target for the domain (alias/ANAME or CNAME); also served directly over HTTPS.
    Value: !GetAtt SiteDistribution.DomainName
  CloudFrontResponseHeadersPolicyId:
    Description: Value for the CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID deployment variable.
    Value: !Ref SiteResponseHeadersPolicy
  CloudFrontResponseHeadersPolicyArn:
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/${SiteResponseHeadersPolicy}'
  CertificateArn:
    Condition: HasCustomDomain
    Description: ACM certificate attached to CloudFront for DomainName.
    Value: !If [ManagesDns, !Ref SiteCertificate, !Ref AcmCertificateArn]
  SiteUrl:
    Description: Public site URL; use it as PUBLIC_URL once DNS resolves to the distribution.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${SiteDistribution.DomainName}'
