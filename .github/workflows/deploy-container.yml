name: Deploy container to selected cloud

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Existing cloud service to deploy (bootstrap resources first)
        required: true
        type: choice
        default: aws
        options: [aws, azure, gcp]

permissions:
  contents: read

jobs:
  build:
    name: Build and test the release without cloud credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release-artifact: container-release-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DEPLOY_CLOUD: ${{ inputs.cloud }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require manual main-branch deployment and supported cloud
        run: node scripts/deploy-container.mjs validate-selection
      - run: npm ci
      - run: npm run validate:production
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build the one production image
        run: docker build --platform linux/amd64 --provenance=false --build-arg VALIDATE_PRODUCTION=true --tag konda-services:release .
      - name: Exercise the real hardened release container
        run: npm run test:container
        env:
          CONTAINER_IMAGE: konda-services:release
          CONTAINER_PLATFORM: linux/amd64
      - name: Export that exact tested image and its built public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy/container-release/dist
          container="$(docker create konda-services:release)"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          docker cp "$container:/srv/site/." .deploy/container-release/dist/
          docker image inspect --format '{{.Id}}' konda-services:release > .deploy/container-release/image-id.txt
          docker image save konda-services:release | gzip -n > .deploy/container-release/image.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .deploy/container-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy approved release to ${{ inputs.cloud }}
    needs: build
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["aws", "azure", "gcp"]'), inputs.cloud)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: container-${{ inputs.cloud }}
    concurrency:
      group: deploy-container-${{ inputs.cloud }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_CLOUD: ${{ inputs.cloud }}
      CONTAINER_PUBLIC_URL: ${{ vars.CONTAINER_PUBLIC_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_EXTENSION_DIR: ${{ github.workspace }}/.deploy/azure-extensions
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate every required provider variable before authentication
        run: node scripts/deploy-container.mjs validate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.release-artifact }}
          path: .deploy/container-release/
      - run: npm ci
      - name: Load and identify the tested image without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout .deploy/container-release/image.tar.gz | docker load
          node scripts/deploy-container.mjs verify-image
      - name: Confirm runner-provided AWS CLI v2
        if: inputs.cloud == 'aws'
        shell: bash
        run: |
          set -euo pipefail
          version="$(aws --version)"
          case "$version" in
            aws-cli/2.*) printf '%s\n' "$version" ;;
            *) printf 'AWS CLI v2 is required on the runner\n' >&2; exit 1 ;;
          esac
      - name: Install the pinned official Container Apps extension
        if: inputs.cloud == 'azure'
        shell: bash
        run: |
          set -euo pipefail
          az version --output json
          wheel="$RUNNER_TEMP/containerapp-0.3.55-py2.py3-none-any.whl"
          curl --fail --silent --show-error --location --max-time 120 \
            https://azcliprod.blob.core.windows.net/cli-extensions/containerapp-0.3.55-py2.py3-none-any.whl \
            --output "$wheel"
          printf 'd6971ccf8ca73e03df7e123fa7c85e5e63235bb1ac1c274c26bbc1f509d68115  %s\n' "$wheel" | sha256sum --check
          az extension add --source "$wheel" --yes --only-show-errors
      - name: Authenticate to AWS with the environment-bound OIDC role
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: konda-container-deploy
          retry-max-attempts: 3
      - name: Authenticate to Azure with federated identity
        if: inputs.cloud == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to GCP with workload identity federation
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up the official Google Cloud CLI
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '583.0.0'
      - name: Publish the tested image and update only the existing service
        run: node scripts/deploy-container.mjs deploy
      - name: Verify the configured public origin against the tested image
        run: node scripts/verify-deployment.mjs --dist .deploy/container-release/dist