services:
  site:
    image: konda-services:local
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100