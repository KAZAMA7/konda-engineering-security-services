name: Build, test and deploy to S3 and CloudFront

# Release branch: S3-hosting. Pull requests and manual runs on other branches only build and test.
# To release from another branch, change the branch name here, in both job conditions below, and in the
# GitHub "production" environment's deployment-branch rule.
on:
  push:
    branches: [S3-hosting]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test without AWS credentials
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Reject production placeholders before a release build
        if: github.ref == 'refs/heads/S3-hosting' && github.event_name != 'pull_request'
        run: npm run validate:production
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify the S3/CloudFront release contract
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          for (const path of ['dist/index.html', 'dist/404.html', 'scripts/verify-deployment.mjs']) {
            assert(fs.statSync(path).isFile() && fs.statSync(path).size > 0, `Missing ${path}`);
          }
          for (const name of fs.readdirSync('dist', { recursive: true })) {
            assert(!/(^|\/)[._]/.test(name) || name.startsWith('_astro'), `Unexpected reserved-prefix file would be uploaded: ${name}`);
          }
          const policy = JSON.parse(fs.readFileSync('.deploy/response-headers-policy.json', 'utf8'));
          const allowed = ['Comment', 'SecurityHeadersConfig', 'CustomHeadersConfig'];
          assert(Object.keys(policy).every(key => allowed.includes(key)), 'Unexpected policy fields, including Name');
          const security = policy.SecurityHeadersConfig;
          const csp = security.ContentSecurityPolicy.ContentSecurityPolicy;
          assert.equal(typeof csp, 'string');
          assert(csp.length > 0 && csp.length <= 1783 && !/[\r\n]/.test(csp));
          assert(!/unsafe-inline|unsafe-eval/i.test(csp), 'Unsafe CSP source');
          assert.equal(csp, fs.readFileSync('.deploy/csp.txt', 'utf8').trim());
          for (const key of ['ContentSecurityPolicy', 'StrictTransportSecurity', 'ContentTypeOptions', 'FrameOptions', 'ReferrerPolicy']) {
            assert.equal(security[key].Override, true, `${key} must override the origin`);
          }
          assert(security.StrictTransportSecurity.AccessControlMaxAgeSec >= 31536000);
          assert.equal(security.FrameOptions.FrameOption, 'DENY');
          assert(['no-referrer', 'same-origin', 'strict-origin', 'strict-origin-when-cross-origin'].includes(security.ReferrerPolicy.ReferrerPolicy));
          const custom = policy.CustomHeadersConfig;
          assert.equal(custom.Quantity, custom.Items.length);
          assert(custom.Items.every(header => header.Override === true));
          assert(custom.Items.some(header => header.Header.toLowerCase() === 'permissions-policy' && header.Value.length > 0));
          const headers = JSON.parse(fs.readFileSync('.deploy/security-headers.json', 'utf8'));
          assert.equal(headers['Content-Security-Policy'], csp, 'security-headers.json must describe the same policy CloudFront applies');
          assert.equal(headers['Strict-Transport-Security'], `max-age=${security.StrictTransportSecurity.AccessControlMaxAgeSec}`);
          for (const header of custom.Items) assert.equal(headers[header.Header], header.Value);
          NODE
      - name: Upload the deployable build, generated headers and verifier
        if: github.ref == 'refs/heads/S3-hosting' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aws-site-${{ github.sha }}
          path: |
            dist/
            .deploy/
            scripts/verify-deployment.mjs
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  deploy:
    name: Publish to S3 and CloudFront
    needs: build
    if: github.ref == 'refs/heads/S3-hosting' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.prepare.outputs.site-url }}
    concurrency:
      group: aws-site-production
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID: ${{ vars.CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      AWS_PAGER: ''
      AWS_CLI_AUTO_PROMPT: 'off'
    steps:
      - name: Require deployment variables
        run: |
          for name in AWS_REGION AWS_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing production environment variable: %s\n' "$name" >&2
              exit 1
            fi
          done
          if [[ -n "$PUBLIC_URL" && ! "$PUBLIC_URL" =~ ^https://[a-z0-9.-]+/?$ ]]; then
            printf 'PUBLIC_URL must be a bare HTTPS origin such as https://konda.com\n' >&2
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aws-site-${{ github.sha }}
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Assume the production role using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6 (peeled commit)
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: static-site-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true
          retry-max-attempts: 3
          action-timeout-s: 120
      - name: Verify AWS targets and preserve the policy name and ETag
        id: prepare
        run: |
          aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" --output json > distribution.json
          aws cloudfront get-response-headers-policy --id "$CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID" --output json > current-policy.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const distribution = JSON.parse(fs.readFileSync('distribution.json', 'utf8')).Distribution;
          const config = distribution.DistributionConfig;
          const behavior = config.DefaultCacheBehavior;
          assert.equal(distribution.Id, process.env.CLOUDFRONT_DISTRIBUTION_ID);
          assert.equal(config.Enabled, true);
          assert.equal(config.DefaultRootObject, 'index.html');
          assert.equal(config.CacheBehaviors?.Quantity ?? 0, 0, 'Unexpected additional cache behaviors');
          assert.equal(behavior.ViewerProtocolPolicy, 'redirect-to-https');
          assert.equal(behavior.ResponseHeadersPolicyId, process.env.CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID);
          const origin = config.Origins.Items.find(item => item.Id === behavior.TargetOriginId);
          assert.equal(origin.DomainName, `${process.env.S3_BUCKET}.s3.${process.env.AWS_REGION}.amazonaws.com`);
          assert(origin.OriginAccessControlId && origin.S3OriginConfig.OriginAccessIdentity === '');
          assert(/^[a-z0-9-]+\.cloudfront\.net$/.test(distribution.DomainName));
          const aliases = config.Aliases?.Items ?? [];
          if (process.env.PUBLIC_URL) {
            const host = new URL(process.env.PUBLIC_URL).hostname;
            assert(aliases.includes(host), `PUBLIC_URL host ${host} is not an alias of this distribution; add the domain to the stack first`);
          }
          const current = JSON.parse(fs.readFileSync('current-policy.json', 'utf8'));
          assert.equal(current.ResponseHeadersPolicy.Id, process.env.CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID);
          assert(/^[A-Za-z0-9_-]+$/.test(current.ETag));
          const generated = JSON.parse(fs.readFileSync('release/.deploy/response-headers-policy.json', 'utf8'));
          assert(!Object.hasOwn(generated, 'Name'));
          assert(!/unsafe-inline|unsafe-eval/i.test(generated.SecurityHeadersConfig.ContentSecurityPolicy.ContentSecurityPolicy));
          const name = current.ResponseHeadersPolicy.ResponseHeadersPolicyConfig.Name;
          assert(typeof name === 'string' && name.length > 0);
          fs.writeFileSync('next-policy.json', JSON.stringify({ ...generated, Name: name }));
          const siteUrl = process.env.PUBLIC_URL ? new URL(process.env.PUBLIC_URL).origin : `https://${distribution.DomainName}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `etag=${current.ETag}\ndomain=${distribution.DomainName}\nsite-url=${siteUrl}\n`);
          NODE
      - name: Upload immutable hashed assets first without deleting old hashes
        run: |
          if [[ -d release/dist/_astro ]]; then
            aws s3 sync release/dist/_astro/ "s3://${S3_BUCKET}/_astro/" \
              --cache-control 'public, max-age=31536000, immutable' \
              --only-show-errors --no-progress
          fi
      - name: Upload pages and unhashed assets with MIME detection and revalidation
        run: |
          aws s3 cp release/dist/ "s3://${S3_BUCKET}/" --recursive \
            --exclude '_astro/*' \
            --cache-control 'no-cache, max-age=0, must-revalidate' \
            --only-show-errors --no-progress
      - name: Apply this build's generated response headers
        env:
          POLICY_ETAG: ${{ steps.prepare.outputs.etag }}
        run: |
          aws cloudfront update-response-headers-policy \
            --id "$CLOUDFRONT_RESPONSE_HEADERS_POLICY_ID" \
            --if-match "$POLICY_ETAG" \
            --response-headers-policy-config file://next-policy.json \
            --query 'ResponseHeadersPolicy.Id' --output text
      - name: Wait for the distribution and invalidate cached pages, assets and errors
        run: |
          aws cloudfront wait distribution-deployed --id "$CLOUDFRONT_DISTRIBUTION_ID"
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$invalidation_id"
      - name: Verify the CloudFront endpoint serves exactly this release with its security headers
        timeout-minutes: 15
        env:
          CLOUDFRONT_DOMAIN: ${{ steps.prepare.outputs.domain }}
        run: |
          node release/scripts/verify-deployment.mjs --url "https://${CLOUDFRONT_DOMAIN}" \
            --dist release/dist --headers release/.deploy/security-headers.json \
            --attempts 30 --interval-ms 10000
      - name: Verify the public domain once DNS points at the distribution
        if: env.PUBLIC_URL != ''
        timeout-minutes: 10
        run: |
          node release/scripts/verify-deployment.mjs --url "$PUBLIC_URL" --expect-canonical \
            --dist release/dist --headers release/.deploy/security-headers.json \
            --attempts 12 --interval-ms 10000
      - name: Record the release
        env:
          CLOUDFRONT_DOMAIN: ${{ steps.prepare.outputs.domain }}
        run: |
          {
            printf '\n### Release %s\n\n' "$GITHUB_SHA"
            printf -- '- Bucket: %s (%s)\n' "$S3_BUCKET" "$AWS_REGION"
            printf -- '- Distribution: %s at https://%s\n' "$CLOUDFRONT_DISTRIBUTION_ID" "$CLOUDFRONT_DOMAIN"
            printf -- '- Public URL verified: %s\n' "${PUBLIC_URL:-not configured yet (set the PUBLIC_URL environment variable after DNS cut-over)}"
            printf -- '- Roll back by reverting the change on the release branch and letting this workflow republish.\n'
          } >> "$GITHUB_STEP_SUMMARY"
